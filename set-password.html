<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Password — IAS Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">
            <span class="s1"></span>
            <span class="s2"></span>
            <span class="s3"></span>
        </div>
        <div class="logo-text">
            <h1>IAS TRAINING</h1>
            <p>Training and Development</p>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <div class="card">
            <h2>Create Password — Step 2</h2>
            <p style="text-align:center; color:var(--pale-gray); margin-bottom:1.5rem;">Secure your account</p>
            
            <form id="passwordForm">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" required minlength="6">
                </div>
                <button type="submit">Create Account</button>
                <div class="error" id="pwError"></div>
            </form>
            <a href="register.html" class="back-link">← Go back</a>
        </div>
    </div>
</main>

<script src="script.js"></script>
<script>
const temp = getTempData();
if (!temp) { window.location.href = 'register.html'; }

document.getElementById('passwordForm').addEventListener('submit', e => {
    e.preventDefault();
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const err = document.getElementById('pwError');

    if (pw !== confirm) {
        err.textContent = 'Passwords do not match.';
        return;
    }
    if (pw.length < 6) {
        err.textContent = 'Password must be at least 6 characters.';
        return;
    }

    // Save full user account
    saveUser({
        ...temp,
        password: pw
    });
    clearTempData();
    window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
