<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — IAS Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">
            <span class="s1"></span>
            <span class="s2"></span>
            <span class="s3"></span>
        </div>
        <div class="logo-text">
            <h1>IAS TRAINING</h1>
            <p>Training and Development</p>
        </div>
    </div>
</header>

<main>
    <div class="container wide-container">
        <div class="card">
            <h2>Welcome, <span id="userName"></span></h2>
            <p class="subtitle dashboard-greeting">This is your personal training portal</p>

            <div class="user-badge" id="userBadge">
                <p><strong>Email:</strong> <span id="userEmail"></span></p>
                <p style="margin-top:0.5rem;"><strong>Contact:</strong> <span id="userContact"></span></p>
                <div id="adminBadge"></div>
            </div>

            <div class="file-section">
                <h3>📁 Your Training Files</h3>
                
                <!-- ==============================================
                ADD NEW COURSES/FILES HERE — Just copy the line below
                <a href="files/your-file.html" class="file-link">📋 Course Name</a>
                ============================================== -->
                
                <p class="empty-state">No training files have been added yet.<br>Content will appear here as it's uploaded.</p>
            </div>

            <button class="btn secondary-btn" onclick="logout()">Sign Out</button>
        </div>
    </div>
</main>

<script src="script.js"></script>
<script>
requireAuth();
const user = getCurrentUser();

document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
document.getElementById('userEmail').textContent = user.email;
document.getElementById('userContact').textContent = user.contact;

if (user.isAdmin) {
    document.getElementById('userBadge').classList.add('admin-badge');
    document.getElementById('adminBadge').innerHTML = 
        '<span class="admin-tag">🔓 MASTER ADMIN — Full Access</span>';
}
</script>
</body>
</html>
